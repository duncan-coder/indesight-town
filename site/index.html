<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Indesight Town</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one-screen app. Town canvas fills the left, a fixed-width work panel sits on the right; stacks on phones. */
:root{
  color-scheme:dark;
  --bg:#182932; --bar:#1d313e; --side:#1b2d38; --panel:#273d48; --line:#55737a;
  --fg:#f5f1e8; --muted:#a9c2bf; --gold:#ffda83; --mint:#82d3ad; --task:#387a6c; --task-line:#8bc6a7;
  --stage:#f0d3ba; --danger:#ffccbd;
  --display:"Pixelify Sans","Noto Sans TC",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:11px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bar);border-bottom:2px solid #50666b;flex:none}
header strong{font-family:var(--display);font-size:21px;color:var(--gold);letter-spacing:.5px}
header strong span{font-size:12px;color:var(--muted);font-weight:500}
header small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.pill{font-family:var(--display);border:1px solid #647e7d;border-radius:22px;padding:6px 12px;font-size:14px;background:#2e4853;white-space:nowrap;font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,380px)}
#stage{position:relative;min-height:0;overflow:hidden;background:var(--stage);touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#town{position:absolute;inset:0;width:100%;height:100%;display:block}
#maphelp{position:absolute;left:12px;top:12px;background:#172d39dc;padding:9px 12px;border:1px solid #b1b9a3;border-radius:9px;font-size:12px;line-height:1.6;pointer-events:none}
#mapcontrols{position:absolute;bottom:14px;right:12px;display:flex;gap:6px}
#mapcontrols button{background:#1e3449e8;border:1px solid #9bb4a6;color:#fff;border-radius:10px;padding:10px 13px;min-width:42px}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:var(--gold);color:#27333a;border:3px solid #fff5d0;padding:10px 16px;border-radius:12px;font-weight:800;box-shadow:0 8px 30px #0005;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
aside{padding-block:13px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--side);overflow:auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}
h2{font-size:14px;color:var(--gold);margin:0 0 12px}
.tasks{display:grid;gap:8px}
.task{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;width:100%;padding:11px 10px;background:var(--task);border:1px solid var(--task-line);border-radius:9px;color:#fff;font-weight:600;font-size:13px;transition:transform .12s,background .12s}
.task:hover{background:#40897a}
.task:active{transform:scale(.97);background:#469982}
.task b{font-family:var(--display);font-size:13px;color:#ffedbd;white-space:nowrap}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin:10px 0}
.stat b{color:#fff1c9;font-variant-numeric:tabular-nums}
.progress{height:11px;border-radius:12px;background:#172a35;overflow:hidden;border:1px solid #668080}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#ffd177,#ffab5b);width:0%;transition:width .4s}
.district{margin:11px 0}
.district .stat{margin:0 0 5px}
.district .progress{height:7px}
.district .progress i{background:var(--mint)}
#events{max-height:125px;overflow:auto;font-size:12px;color:#d4e0d9}
#events div{padding:6px 0;border-bottom:1px solid #48616b}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.actions button{padding:10px 8px;border:1px solid #688c8a;border-radius:9px;background:#344d5a;color:#eaf6ef;font-size:12px}
.actions .danger{grid-column:span 2;color:var(--danger)}
.actions .danger.armed{background:#7a3b33;border-color:#ffb3a0;color:#fff}
footer{font-size:11px;color:#9db5b4;line-height:1.6;margin:0 2px}
@media(max-width:700px){
  html,body{height:auto}
  body{display:block}
  main{display:block}
  header strong{font-size:17px}
  #stage{height:57vh;height:57svh;min-height:340px}
  aside{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .pill{font-size:12px;padding:6px 9px}
  #maphelp{font-size:11px;top:8px;left:8px;padding:6px 9px}
}
</style>

</head>
<body>
<header>
  <div>
    <strong>✦ INDESIGHT TOWN <span>V1.5.6 原型</span></strong>
    <small>Cozy Modern Pixel Town · 工作成就養成小鎮</small>
  </div>
  <div class="pill" id="topstat">LV 1 · 0 XP</div>
</header>
<main>
  <section id="stage" aria-label="可拖曳縮放的城鎮遊戲地圖">
    <canvas id="town"></canvas>
    <div id="maphelp">🏘️ 完成任務，街區會成長<br>🚶 居民沿著道路散步<br>↔ 拖曳探索 · 滾輪或雙指縮放</div>
    <div id="toast" role="status"></div>
    <div id="mapcontrols">
      <button id="minus" aria-label="縮小地圖">−</button>
      <button id="center" aria-label="回到城鎮中心">⌖</button>
      <button id="plus" aria-label="放大地圖">＋</button>
    </div>
  </section>
  <aside>
    <section class="panel">
      <h2>⭐ 模擬 NOTION 完成任務</h2>
      <div class="tasks">
        <button class="task" data-t="general"><span>✓ 完成一般工作</span><b>+10 XP</b></button>
        <button class="task" data-t="social"><span>📣 發布 X 貼文</span><b>+15 XP</b></button>
        <button class="task" data-t="seo"><span>📚 發布 SEO 文章</span><b>+50 XP</b></button>
        <button class="task" data-t="partner"><span>🤝 建立合作夥伴</span><b>+75 XP</b></button>
        <button class="task" data-t="template"><span>🖥️ 上架 Framer 模板</span><b>+100 XP</b></button>
        <button class="task" data-t="revenue"><span>🏆 達成營收里程碑</span><b>+200 XP</b></button>
      </div>
    </section>
    <section class="panel">
      <h2>🏡 城鎮狀態</h2>
      <div class="stat"><span>城鎮等級</span><b id="level">1</b></div>
      <div class="stat"><span>累積經驗</span><b id="xp">0 XP</b></div>
      <div class="progress"><i id="xpbar"></i></div>
      <div class="stat"><span>距離升級</span><b id="next">250 XP</b></div>
      <div class="stat"><span>完成任務</span><b id="done">0</b></div>
      <div class="stat"><span>城鎮人口</span><b id="population">6</b></div>
      <div class="stat"><span>已解鎖擴建</span><b id="built">0</b></div>
    </section>
    <section class="panel">
      <h2>🌿 街區發展</h2>
      <div id="districts"></div>
    </section>
    <section class="panel">
      <h2>📜 發展紀錄</h2>
      <div id="events"></div>
    </section>
    <section class="panel">
      <div class="actions">
        <button id="day">🌙 切換夜晚</button>
        <button id="home">⌖ 城鎮中心</button>
        <button id="reset" class="danger">↻ 重設進度</button>
      </div>
    </section>
    <footer>V1.5.6 原型：等距格子地圖，建築、樹木、街道小物與居民已換成正式美術，地面由程式繪製。尚未串接 Notion。進度保存在本機瀏覽器，沿用 V1.4 的存檔。</footer>
  </aside>
</main>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ───────── 1. 規則與存檔（與 V1.4 相同的鍵名與格式，舊進度可直接讀取） ───────── */
const KEY = 'indesight-town-v14';
const KINDS = {
  general:  {name:'住宅',       icon:'🏠', xp:10,  per:5},
  social:   {name:'廣播塔',     icon:'📡', xp:15,  per:4},
  seo:      {name:'圖書館',     icon:'📚', xp:50,  per:2},
  partner:  {name:'商會',       icon:'☕', xp:75,  per:2},
  template: {name:'設計工作室', icon:'🖥️', xp:100, per:2},
  revenue:  {name:'市政廳',     icon:'🏛️', xp:200, per:2},
};
const KEYS = Object.keys(KINDS);
const fresh = msg => ({xp:0, done:0, counts:Object.fromEntries(KEYS.map(k => [k,0])), events:[msg]});
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!state || !state.counts) state = fresh('歡迎來到 Indesight Town！');
for (const k of KEYS) state.counts[k] ??= 0;
state.xp ??= 0; state.done ??= 0; state.events ??= [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const level = () => Math.floor(state.xp / 250) + 1;
const expN = k => Math.floor(state.counts[k] / KINDS[k].per);       // 該街區擴建次數
const totalBuilt = () => KEYS.reduce((a,k) => a + expN(k), 0);
const pop = () => 6 + Math.min(100, Math.floor(state.done * 1.25));
const hash = (x,y,s=0) => { const v = Math.sin(x*127.1 + y*311.7 + s*74.7) * 43758.5453; return v - Math.floor(v); };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── 2. 地圖配置（等距格子） ───────── */
const MW = 29, MH = 31;                      // 格數
const ROAD_X = [5,11,17,23], ROAD_Y = [5,11,17,25], RIVER_Y = [23,24];
const OX = MH*16, OY = 120;                  // 世界座標原點
const WW = (MW+MH)*16, WH = (MW+MH)*8 + OY + 24;
const iso = (tx,ty) => [(tx-ty)*16 + OX, (tx+ty)*8 + OY];
const blockOrigin = (bx,by) => [bx*6, by < 4 ? by*6 : 26];
const MAIN  = {revenue:[2,0], social:[3,0], seo:[1,1], partner:[3,1], general:[1,2], template:[2,2]};
const PLAZA = [2,1];
const EXPAND = {
  general:[[1,3],[0,3],[0,4]], seo:[[0,1],[0,2],[1,4]], revenue:[[1,0],[0,0],[2,4]],
  social:[[4,0],[4,1],[4,4]], partner:[[3,2],[4,2],[3,4]], template:[[2,3],[3,3],[4,3]],
};
const LOT_OFF = [[3,3],[0,3],[3,0],[0,0]];
const LOTS = {};
for (const k of KEYS) LOTS[k] = EXPAND[k].flatMap(([bx,by]) => { const [x0,y0] = blockOrigin(bx,by); return LOT_OFF.map(([ox,oy]) => ({x:x0+ox, y:y0+oy, bx, by})); });
const lotTier = (k,i) => { const n = expN(k); return n > i ? Math.min(3, Math.floor((n-1-i)/LOTS[k].length) + 1) : 0; };

function tileInfo(x,y){
  if (x < 0 || y < 0 || x >= MW || y >= MH) return {t:'void'};
  if (RIVER_Y.includes(y)) return {t: ROAD_X.includes(x) ? 'bridge' : 'river'};
  if (ROAD_X.includes(x) || ROAD_Y.includes(y)) return {t:'road'};
  const bx = Math.floor(x/6), by = y >= 26 ? 4 : Math.floor(y/6);
  const [x0,y0] = blockOrigin(bx,by);
  return {t:'block', bx, by, ox:x-x0, oy:y-y0};
}

/* ───────── 3. 像素繪圖工具 ───────── */
function mk(w,h,ax,ay){ const c = document.createElement('canvas'); c.width = w; c.height = h; return {c, x:c.getContext('2d'), ax, ay}; }
function px(c,x,y,w,h,col){ if (w <= 0 || h <= 0) return; c.fillStyle = col; c.fillRect(Math.round(x),Math.round(y),w,h); }
function disk(c,cx,cy,r,col){ for (let dy=-r; dy<=r; dy++){ const hw = Math.floor(Math.sqrt(r*r + r*.8 - dy*dy)); px(c,cx-hw,cy+dy,hw*2+1,1,col); } }
function ellipse(c,cx,cy,rx,ry,col){ for (let dy=-ry; dy<=ry; dy++){ const hw = Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry+.5)))); px(c,cx-hw,cy+dy,hw*2+1,1,col); } }
function diamond(c,X,Y,col){ for (let r=0; r<16; r++){ const hw = r < 8 ? (r+1)*2 : (16-r)*2; px(c,X-hw,Y+r,hw*2,1,col); } }
/* 石板地磚：一格切成 2×2 塊，畫出磚縫 */
function paver(c,X,Y,col,grout){
  diamond(c,X,Y,col);
  for (let i=0; i<16; i++){ const d = i>>1; px(c,X-i-1,Y+d,1,1,grout); px(c,X+i,Y+d,1,1,grout); px(c,X-8+i,Y+4+d,1,1,grout); px(c,X+7-i,Y+4+d,1,1,grout); }
}
/* 等距方盒：(ax,ay) 是底面最靠近鏡頭的頂點，w/d 為右、左牆的水平寬度(px)，h 為高度 */
function box(c,ax,ay,w,d,h,top,left,right){
  for (let i=0; i<w; i++) px(c, ax+i, ay-(i>>1)-h, 1, h, right);
  for (let i=1; i<=d; i++) px(c, ax-i, ay-((i-1)>>1)-h, 1, h, left);
  const lx = ax-d, tx = ax+w-d;
  for (let x=lx; x<ax+w; x++){
    const lower = x >= ax ? ay-h-((x-ax)>>1) : ay-h-((ax-x-1)>>1);
    const upper = x < tx ? ay-h-(d>>1)-((x-lx+1)>>1) : ay-h-((d+w)>>1)+((x-tx)>>1);
    px(c, x, upper, 1, lower-upper, top);
  }
}
const rface = (c,ax,ay,u,v,w,h,col) => { for (let i=u; i<u+w; i++) px(c, ax+i, ay-(i>>1)-v-h, 1, h, col); };
const lface = (c,ax,ay,u,v,w,h,col) => { for (let i=u+1; i<=u+w; i++) px(c, ax-i, ay-((i-1)>>1)-v-h, 1, h, col); };
/* 以屋頂中心為準的置中方盒 */
const cbox = (c,ax,cy,s,z,h,top,left,right) => box(c, ax, cy+(s>>1)-z, s, s, h, top, left, right);
function hipRoof(c,ax,ay,w,P){            // 回傳屋頂高度
  let l = 0;
  for (let s=-1; w-2*s > 3; s+=3, l++) box(c, ax, ay-l*2-s, w-2*s, w-2*s, 2, l%2 ? P.rt : P.rt2, P.rl, P.rr);
  return l*2;
}

const PAL = {
  general:  {wr:'#f6e7c8', wl:'#e2cda6', top:'#ead9b6', rt:'#c9603a', rt2:'#b9532f', rl:'#8f3d22', rr:'#a84a2a', door:'#7a4a2c', base:'#b9a58c'},
  social:   {wr:'#ead6d4', wl:'#cfb4b6', top:'#dec8c6', rt:'#8a5f7a', rt2:'#7d546e', rl:'#5e3e53', rr:'#6f4a62', door:'#5a3b4b', base:'#a8909a'},
  seo:      {wr:'#efe2c6', wl:'#d8c7a4', top:'#e4d6b8', rt:'#5f8a8f', rt2:'#557e83', rl:'#3f6266', rr:'#4b7075', door:'#6b4a2f', base:'#b5a58b'},
  partner:  {wr:'#d99672', wl:'#bf7b58', top:'#cf8c68', rt:'#8a5638', rt2:'#7d4c30', rl:'#5c3622', rr:'#6e422b', door:'#5a3323', base:'#a06445'},
  template: {wr:'#5a4d53', wl:'#463b41', top:'#62555b', rt:'#62555b', rt2:'#584b51', rl:'#3a3136', rr:'#4a3f45', door:'#2f272b', base:'#3a3136', flat:true},
  revenue:  {wr:'#f8eed6', wl:'#e3d5b4', top:'#eee2c6', rt:'#6f8fa3', rt2:'#65859a', rl:'#4b697c', rr:'#587689', door:'#6b4a2f', base:'#c2b094', flat:true},
};
/* 窗戶白天也透出暖光，晚上更亮 */
const GLASS = '#f2b659', GLASS_HI = '#ffdf9c', LIT = '#ffd063', LIT_HI = '#fff3c4';
function windowR(c,ax,ay,u,v,w,h,lit){ rface(c,ax,ay,u,v,w,h, lit ? LIT : GLASS); rface(c,ax,ay,u,v+h-1,w,1, lit ? LIT_HI : GLASS_HI); if (w <= 6){ rface(c,ax,ay,u+(w>>1),v,1,h,'#b9803a'); rface(c,ax,ay,u-1,v-1,w+2,1,'#8a5a3a'); } }
function windowL(c,ax,ay,u,v,w,h,lit){ lface(c,ax,ay,u,v,w,h, lit ? '#f0c560' : '#dca048'); lface(c,ax,ay,u,v+h-1,w,1, lit ? LIT_HI : GLASS_HI); if (w <= 6){ lface(c,ax,ay,u+(w>>1),v,1,h,'#a06f30'); lface(c,ax,ay,u-1,v-1,w+2,1,'#7a4e30'); } }
function flowerBox(c,ax,ay,u,v,w){ rface(c,ax,ay,u-1,v-2,w+2,2,'#6c8c3a'); rface(c,ax,ay,u,v-1,1,1,'#f2a0b8'); rface(c,ax,ay,u+w-2,v-1,1,1,'#fbe0ea'); }
function awning(c,ax,ay,w,v,a,b,both){ for (let u=0; u<w; u+=3){ rface(c,ax,ay,u,v,Math.min(3,w-u),3,(u/3)%2 ? a : b); if (both) lface(c,ax,ay,u,v,Math.min(3,w-u),3,(u/3)%2 ? b : a); } }

/* 擴建用小建築：佔 2×2 格，tier 1–3 決定樓層 */
function lotSprite(k,tier,lit){
  const P = PAL[k], S = mk(64,104,32,98), c = S.x, ax = 32, ay = 95, w = 26, fh = 11, h = tier*fh + 3;
  ellipse(c, ax, ay-12, 24, 11, 'rgba(80,50,35,.22)');
  box(c,ax,ay,w,w,h,P.top,P.wl,P.wr);
  rface(c,ax,ay,0,0,w,2,P.base); lface(c,ax,ay,0,0,w,2,P.base);
  for (let f=0; f<tier; f++){
    const v = 4 + f*fh, big = k === 'template';
    if (big){ windowR(c,ax,ay,3,v-1,20,7,lit); rface(c,ax,ay,9,v-1,1,7,P.base); rface(c,ax,ay,16,v-1,1,7,P.base); }
    else for (const u of [4,12,20]){ windowR(c,ax,ay,u,v,4,5,lit); if (k === 'general') flowerBox(c,ax,ay,u,v,4); }
    for (const u of (f === 0 ? [3,19] : [4,12,20])) windowL(c,ax,ay,u,v,4,5,lit);
  }
  lface(c,ax,ay,10,0,6,8,P.door); lface(c,ax,ay,10,8,6,1,P.base);
  if (k === 'partner') awning(c,ax,ay,w,10,'#e0523f','#fff4e0',false);
  let top = ay - h;
  if (P.flat){ box(c,ax,top+1,w+2,w+2,2,P.rt,P.rl,P.rr); top -= 1; }
  else top -= hipRoof(c,ax,top,w,P);
  const cy = ay - h - (w>>1);                                   // 屋頂中心
  if (k === 'general'){ box(c,ax+7,cy+2,4,4,7,'#8a5a45','#6d4636','#7c5040'); }
  if (k === 'social'){ px(c,ax,top-12,1,14,'#e9e4d2'); px(c,ax-3,top-8,7,1,'#e9e4d2'); px(c,ax,top-13,1,2,'#e0523f'); }
  if (k === 'seo'){ lface(c,ax,ay,8,10,10,3,'#f2c14e'); }
  if (k === 'template'){ disk(c,ax-5,cy-3,3,'#6c8c3a'); disk(c,ax+5,cy-2,2,'#8fa846'); }
  if (k === 'revenue'){ px(c,ax,cy-13,1,12,'#e9e4d2'); px(c,ax+1,cy-13,5,3,'#e0523f'); rface(c,ax,ay,0,h-2,w,1,'#f2c14e'); lface(c,ax,ay,0,h-2,w,1,'#d9a93f'); }
  return S;
}

/* 主建築：佔 3×3 格，隨街區等級長高並增加細節 */
function mainSprite(k,lv,lit){
  const P = PAL[k], S = mk(120,190,60,180), c = S.x, ax = 60, ay = 176, w = 40, fh = 12;
  const floors = [2,2,3,3,4][Math.min(lv,5)-1], h = floors*fh + 4;
  ellipse(c, ax, ay-19, 37, 17, 'rgba(80,50,35,.22)');

function rebuild(){

    const [bx,by] = MAIN[k], [x0,y0] = blockOrigin(bx,by), lv = 1 + expN(k), vis = Math.min(lv,5);
    const [X,Y] = iso(x0+4,y0+4);

    put({X, Y, key:x0+1+y0+1+3-1.5, id:'main:'+k, glow:[X,Y-40,34], get:lit => art || spr(`main:${k}:${vis}:${lit}`, () => mainSprite(k,vis,lit))});
    labels.push({X, Y:Y-(s0.ay-s0.top)-6, text:`${KINDS[k].name} Lv.${lv}`, k});
    for (let oy=1; oy<=3; oy++) for (let ox=1; ox<=3; ox++) occupied.add((x0+ox)+','+(y0+oy));
    LOTS[k].forEach((L,i) => {

      put({X:LX, Y:LY, key:L.x+L.y+2-1.5, id:`lot:${k}:${i}`, glow:[LX,LY-22,22], get:lit => ART['lot:'+k] || spr(`lot:${k}:${tier}:${lit}`, () => lotSprite(k,tier,lit))});
      for (let oy=0; oy<2; oy++) for (let ox=0; ox<2; ox++) occupied.add((L.x+ox)+','+(L.y+oy));

    const t = tileInfo(x,y), [X,Y] = iso(x,y), r = hash(x,y), alt = (x+y)%2;

      diamond(g,X,Y, alt ? '#7fb5be' : '#88bdc6');
      if (r < .5) sparkles.push([X-6+Math.floor(r*20), Y+5+Math.floor(hash(x,y,3)*6), r*10]);
    } else if (t.t === 'bridge'){
      diamond(g,X,Y,'#c08a55'); for (let i=2; i<16; i+=4) px(g,X-12+i,Y+3+(i>>1),8,1,'#9a6a3c');
      walk.add(x+','+y);
    } else if (t.t === 'road'){

        walk.add(x+','+y);
      } else wild = true;

      if (dev){ const a = iso(x,y), b = iso(x+1,y+1); minX = Math.min(minX,a[0]-16); maxX = Math.max(maxX,a[0]+16); minY = Math.min(minY,a[1]); maxY = Math.max(maxY,b[1]); }

        const isMain = KEYS.some(k => MAIN[k][0] === t.bx && MAIN[k][1] === t.by);

            if ((t.ox === 0 && t.oy === 0) || (t.ox === 4 && t.oy === 0) || (t.ox === 0 && t.oy === 4)) tree(x,y, r < .35 ? 1 : 0);
            else if (t.ox === 4 && t.oy === 4) lamp(x,y);

const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
function nextTile(r){
  const opts = DIRS.map(([dx,dy]) => [r.x+dx, r.y+dy]).filter(([x,y]) => walk.has(x+','+y));
  const fwd = opts.filter(([x,y]) => !(x === r.px && y === r.py));
  const pick = (fwd.length ? fwd : opts);
  if (!pick.length) return [r.x, r.y];
  return pick[Math.floor(Math.random()*pick.length)];
}
function syncResidents(){
  const want = Math.min(pop(), 44);
  residents = residents.filter(r => walk.has(r.x+','+r.y) && walk.has(r.tx+','+r.ty)).slice(0, want);
  while (residents.length < want && walkList.length){
    const i = residents.length, [x,y] = walkList[Math.floor(hash(i,7,state.done)*walkList.length)];
    const r = {i, x, y, px:x, py:y, tx:x, ty:y, t:0, pause:hash(i,3)*2, speed:.75 + hash(i,1)*.5, ox:(hash(i,4)-.5)*.5, oy:(hash(i,5)-.5)*.5};
    [r.tx, r.ty] = nextTile(r); residents.push(r);
  }
}
function stepResidents(dt){
  for (const r of residents){
    if (r.pause > 0){ r.pause -= dt; continue; }
    r.t += r.speed*dt;
    if (r.t >= 1){
      r.px = r.x; r.py = r.y; r.x = r.tx; r.y = r.ty; r.t = 0;
      [r.tx, r.ty] = nextTile(r);
      if (Math.random() < .12) r.pause = 1 + Math.random()*2.5;
    }
  }
}

/* ───────── 6. 鏡頭與繪製 ───────── */
const stage = $('stage'), cv = $('town'), ctx = cv.getContext('2d');
let zoom = 2, panX = 0, panY = 0, camTarget = null, dpr = 1, night = false, nightAmt = 0, last = 0;
let particles = [], floaters = [];
function resize(){ dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(stage.clientWidth*dpr); cv.height = Math.round(stage.clientHeight*dpr); }
function fitTown(animate){
  const w = stage.clientWidth, h = stage.clientHeight, bw = bounds.maxX - bounds.minX, bh = bounds.maxY - bounds.minY;
  const z = Math.max(1.2, Math.min(4, Math.min(w/bw, h/bh)*.94));
  const t = {zoom:z, panX:w/2 - (bounds.minX+bw/2)*z, panY:h/2 - (bounds.minY+bh/2)*z};
  if (animate && !REDUCED) camTarget = t; else { ({zoom, panX, panY} = t); camTarget = null; }
}
function zoomAt(x,y,f){ camTarget = null; const nz = Math.min(6, Math.max(.7, zoom*f)); panX = x - (x-panX)*nz/zoom; panY = y - (y-panY)*nz/zoom; zoom = nz; }
function panTo(X,Y){ const t = {zoom, panX:stage.clientWidth/2 - X*zoom, panY:stage.clientHeight*.55 - Y*zoom}; if (REDUCED){ panX = t.panX; panY = t.panY; } else camTarget = t; }
const easeBack = p => { const c = 1.9; return 1 + (c+1)*Math.pow(p-1,3) + c*Math.pow(p-1,2); };

function drawSprite(s,X,Y,flip,sy){
  if (s.s){ ctx.save(); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.translate(X,Y); ctx.scale(flip ? -1 : 1, sy); ctx.drawImage(s.c,-s.ax,-s.ay,s.c.width*s.s,s.c.height*s.s); ctx.restore(); return; }
  if (flip || sy !== 1){ ctx.save(); ctx.translate(X,Y); ctx.scale(flip ? -1 : 1, sy); ctx.drawImage(s.c,-s.ax,-s.ay); ctx.restore(); }
  else ctx.drawImage(s.c, X-s.ax, Y-s.ay);
}
function frame(t){
  const dt = Math.min(.05, (t-last)/1000 || .016); last = t;
  if (camTarget){ const k = 1 - Math.pow(.002, dt); zoom += (camTarget.zoom-zoom)*k; panX += (camTarget.panX-panX)*k; panY += (camTarget.panY-panY)*k;
    if (Math.abs(camTarget.panX-panX) + Math.abs(camTarget.panY-panY) < .5) camTarget = null; }
  nightAmt += ((night ? 1 : 0) - nightAmt) * Math.min(1, dt*3);
  const lit = nightAmt > .5 ? 1 : 0;
  stepResidents(dt);

  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#f0d3ba'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(zoom*dpr,0,0,zoom*dpr,Math.round(panX*dpr),Math.round(panY*dpr)); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(ground.c,0,0);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (const [X,Y,ph] of sparkles) if (Math.floor(t/700 + ph) % 3 === 0) ctx.fillRect(X,Y,3,1);

  const movers = residents.map(r => {
    const fx = r.x + (r.tx-r.x)*r.t, fy = r.y + (r.ty-r.y)*r.t, [X,Y] = iso(fx+.5+r.ox, fy+.5+r.oy);
    const dx = r.tx-r.x, dy = r.ty-r.y, moving = r.pause <= 0 && (dx || dy);
    const fr = moving ? 1 + Math.floor(t/170 + r.i) % 2 : 0, back = (dx+dy) < 0 ? 1 : 0;
    /* 角色圖：正面往右下走、背面往左上走為原始方向，其餘方向左右翻轉 */
    const pa = PEOPLE && PEOPLE[r.i % PEOPLE.length][back][moving ? Math.floor(t/150 + r.i) % 4 : 1];
    if (pa) return {X:Math.round(X), Y:Math.round(Y), key:fx+fy, flip: back ? (dx-dy) >= 0 : (dx-dy) < 0, get:() => pa};
    return {X:Math.round(X), Y:Math.round(Y), key:fx+fy, flip:(dx-dy) < 0, get:() => spr(`p:${r.i%24}:${back}:${fr}`, () => personSprite(r.i%24, back, fr))};
  });
  const all = statics.concat(movers).sort((a,b) => a.key - b.key);
  for (const o of all){
    let sy = 1;
    if (o.id && born[o.id]){ const p = (t - born[o.id])/650; if (p >= 1) delete born[o.id]; else if (p >= 0) sy = Math.max(.05, easeBack(p)); }
    drawSprite(o.get(lit), o.X, o.Y, o.flip, sy);
    if (o.fountain && !ART.fountain){ ctx.fillStyle = '#eaf8ff'; for (let i=0; i<5; i++){ const p = (t/500 + i*.2) % 1; ctx.fillRect(o.X-1+Math.round((i-2)*p*3), o.Y-27+Math.round(p*p*10), 1, 1); } }
  }
  particles = particles.filter(p => p.life > 0);
  for (const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 90*dt; p.life -= dt*1.1; ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2); }
  ctx.globalAlpha = 1;

  if (nightAmt > .01){
    ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = `rgba(14,22,66,${.52*nightAmt})`; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(zoom*dpr,0,0,zoom*dpr,Math.round(panX*dpr),Math.round(panY*dpr)); ctx.globalCompositeOperation = 'lighter';
    const glow = (X,Y,R,a) => { const gr = ctx.createRadialGradient(X,Y,0,X,Y,R); gr.addColorStop(0,`rgba(255,210,120,${a*nightAmt})`); gr.addColorStop(1,'rgba(255,210,120,0)'); ctx.fillStyle = gr; ctx.fillRect(X-R,Y-R,R*2,R*2); };
    for (const [X,Y] of lamps) glow(X,Y,20,.55);
    for (const o of statics) if (o.glow) glow(o.glow[0],o.glow[1],o.glow[2],.22);
    ctx.globalCompositeOperation = 'source-over';
  }

  // 螢幕座標：街區標籤與 XP 浮字
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (zoom >= 1.1){
    ctx.font = '700 12px system-ui,"Noto Sans TC",sans-serif';
    for (const L of labels){
      const x = L.X*zoom + panX, y = L.Y*zoom + panY, w = ctx.measureText(L.text).width + 16;
      ctx.fillStyle = 'rgba(24,41,50,.9)'; ctx.strokeStyle = '#e3c891'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(x-w/2, y-11, w, 22, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe9b0'; ctx.fillText(L.text, x, y+.5);
    }
  }
  floaters = floaters.filter(f => f.life > 0);
  ctx.font = '700 15px "Pixelify Sans",system-ui,sans-serif';
  for (const f of floaters){ f.life -= dt*.8; const x = f.X*zoom + panX, y = f.Y*zoom + panY - (1-f.life)*46; ctx.globalAlpha = Math.min(1, f.life*2);
    ctx.lineWidth = 3; ctx.strokeStyle = '#1d313e'; ctx.strokeText(f.text,x,y); ctx.fillStyle = '#ffe07a'; ctx.fillText(f.text,x,y); }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

/* ───────── 7. 介面與任務 ───────── */
function toast(msg){ const el = $('toast'); el.textContent = msg; el.style.opacity = 1; clearTimeout(toast.timer); toast.timer = setTimeout(() => el.style.opacity = 0, 2000); }
function update(){
  const lv = level();
  $('level').textContent = lv; $('xp').textContent = state.xp.toLocaleString() + ' XP';
  $('next').textContent = (250 - state.xp%250) + ' XP'; $('xpbar').style.width = (state.xp%250)/250*100 + '%';
  $('done').textContent = state.done; $('population').textContent = pop(); $('built').textContent = totalBuilt();
  $('topstat').textContent = 'LV ' + lv + ' · ' + state.xp.toLocaleString() + ' XP';
  $('districts').innerHTML = KEYS.map(k => { const K = KINDS[k], n = state.counts[k];
    return `<div class="district"><div class="stat"><span>${K.icon} ${K.name}</span><b>Lv.${1+Math.floor(n/K.per)}</b></div><div class="progress"><i style="width:${n%K.per/K.per*100}%"></i></div></div>`; }).join('');
  $('events').innerHTML = state.events.slice(0,18).map(e => '<div>' + String(e).replace(/[<>&]/g,'') + '</div>').join('');
}
function burst(X,Y,n){ for (let i=0; i<n; i++) particles.push({x:X, y:Y, vx:(Math.random()-.5)*70, vy:-20-Math.random()*70, life:1, color:['#ffe5a0','#fff8e0','#f4a9c6','#9de6c7'][i%4]}); }
function build(k){
  const K = KINDS[k], prevLv = level(), oldN = expN(k);
  state.xp += K.xp; state.done++; state.counts[k]++;
  const n = expN(k), unlocked = n > oldN;
  state.events.unshift(`${unlocked ? '🏗️' : '✓'} ${K.name} +${K.xp} XP${unlocked ? ' · 街區擴建！' : ''}`);
  if (level() > prevLv) state.events.unshift(`⭐ 城鎮升級至 Lv.${level()}`);
  state.events = state.events.slice(0,60);
  const [bx,by] = MAIN[k], [x0,y0] = blockOrigin(bx,by), [MX,MY] = iso(x0+2.5,y0+2.5);
  if (unlocked){
    const i = (n-1) % LOTS[k].length, L = LOTS[k][i], [LX,LY] = iso(L.x+1,L.y+1), now = performance.now();
    if (!REDUCED){ born[`lot:${k}:${i}`] = now; born['main:'+k] = now; }
    rebuild(); burst(LX,LY-10,36); burst(MX,MY-30,18); panTo(LX,LY);
  } else { syncResidents(); burst(MX,MY-30,16); }
  floaters.push({X:MX, Y:MY-50, text:'+' + K.xp + ' XP', life:1});
  update(); save();
  toast(unlocked ? `🏗️ ${K.name}街區新增建設！` : `✨ +${K.xp} XP · ${K.name}成長`);
}
document.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => build(b.dataset.t)));
$('day').onclick = () => { night = !night; $('day').textContent = night ? '☀️ 切換白天' : '🌙 切換夜晚'; };
$('home').onclick = $('center').onclick = () => fitTown(true);
$('plus').onclick = () => zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.25);
$('minus').onclick = () => zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1/1.25);
let armTimer;
$('reset').onclick = () => {                                   // 兩段式確認，不使用瀏覽器對話框
  const b = $('reset');
  if (!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = '再按一次，確定清除所有進度'; armTimer = setTimeout(() => { b.classList.remove('armed'); b.textContent = '↻ 重設進度'; }, 4000); return; }
  clearTimeout(armTimer); b.classList.remove('armed'); b.textContent = '↻ 重設進度';
  state = fresh('重新開始城鎮'); residents = []; save(); rebuild(); update(); fitTown(true); toast('已重新開始小鎮');
};

/* 拖曳、滾輪、雙指縮放 */
const pointers = new Map(); let prevDist = 0;
stage.addEventListener('pointerdown', e => { if (e.target.closest('button') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); stage.setPointerCapture(e.pointerId); camTarget = null; });
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const old = pointers.get(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pointers.size === 1){ panX += e.clientX-old.x; panY += e.clientY-old.y; }
  else if (pointers.size === 2){ const [a,b] = [...pointers.values()], dist = Math.hypot(a.x-b.x,a.y-b.y), r = stage.getBoundingClientRect();
    if (prevDist) zoomAt((a.x+b.x)/2-r.left, (a.y+b.y)/2-r.top, dist/prevDist); prevDist = dist; }
});
const end = e => { pointers.delete(e.pointerId); prevDist = 0; };
['pointerup','pointercancel','lostpointercapture'].forEach(n => stage.addEventListener(n,end));
stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect();
  const units = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? r.height : 1, d = Math.max(-100, Math.min(100, e.deltaY*units));
  zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-d*.0018)); }, {passive:false});
new ResizeObserver(() => { resize(); }).observe(stage);

rebuild(); resize(); fitTown(false); update(); loadArt(); requestAnimationFrame(frame);
window.__town = {state:() => state, cam:() => ({zoom,panX,panY}), residents:() => residents, walk:() => walk};
})();
</script>
</body>
